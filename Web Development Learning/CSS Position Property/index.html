<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position Property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
         .box {
            height: 40px;
            width: 80vw;
            padding: 8px;
            /* margin: 20px; */
            border: 2px solid black;
        }


        .box1 {
            background-color: antiquewhite;

            /* position: absolute;
            top: 0px; */
            /* box 2 box 1 k back pe le jane k liye 
            position relative aur z index 1 krdeingy */
            /* position:relative; 
            z-index: 1 ; */
            

        }


        .box2 {
            background-color: aqua;
            /* position: relative;
            top: -10px; 
            left: 30px;  */
            

        }

        .box3 {
            background-color: brown;
            position: fixed;
            bottom: 0px;
            left: 8vw;
            height: 30px;
        }

        .box4 {
            background-color: blueviolet;
            /* jab tak is tak scroll nahi krengy
             tab tak nahi sticky hogi like nav bar  */
            position: sticky;
            top: 0px;
            height: 111px;
            width: 100%;
            margin: 0;
            padding: 0;
        }

       
        .parent {
            padding: 30px;
            margin: 34px;
            border: 2px solid purple;
            position: absolute;
            /* transform,filter,perspective these are also property; */
            /* transform: translate(0); */
            /* filter: invert(0); */
            /* perspective: 0; */
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
        <div class="box box4">Box 4</div>
    </div>
</body>

</html>
