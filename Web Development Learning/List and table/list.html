<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List And Table</title>
</head>
  
        
<body>
    <link rel="stylesheet" href="list.css">
    <table>
        <thead>
            <h3>
                Information Table
            </h3>
        </thead>
        <tbody>
        <tr>
            <th>Name </th>
            <th>Age </th>
            <th>Game</th>
            
        </tr>
        <tr>
            <td colspan="2">Bilal Ahmad </td>
            <td>20 </td>
            <td>Free Fire</td>
        </tr>
        
        <tr>
            <td >Sohail Ahmad </td>
            <td rowspan="2">18 </td>
            <td>PUBG</td>
        </tr>
        <tr>
            <td>Jawad Ahmad </td>
            <td>19 </td>
            <td>GTA V</td>
        </tr>
        </tbody>
    </table>
    <tfoot>
         <h4>End of the table</h4>
         </tfoot>
<br>
   
<br>
    <caption>
      List   
    </caption>
    <ol type="1">
        <li>Bilal</li>
        <li>Sohail</li>
        <li>Jawad</li>
    </ol>
    <ol type="a">
        <li>Bilal</li>
        <li>Sohail</li>
        <li>Jawad</li>
    </ol>
    
    <ul type="square">
        <li>Bilal</li>
        <li>Sohail</li>
        <li>Jawad</li>
    </ul>

    <dl >
        <dt>Set:</dt>
        <dd>A collection of well-defined and distinct object is called Set</dd>
        
    </dl>


</body>

</html>
