<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root
        {
            --primerycolor: aqua;
            --seccolor:rgb(170, 244, 244);
            --textcolor: rgb(23, 25, 145);
        }
        nav
        {
            padding: 2px;
            margin: 2px;
            background-color: var(--primerycolor);
        }
        ul li{
            display: inline;
            padding: 4px;
            margin: 4px;
            color: var(--textcolor);
        }
        body{
            background-color:var(--seccolor) ;
        }
        div p  
        {
            padding: 5px;
            background-color: var(--seccolor);
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li type="none">Home</li>
                <li type="none">Services</li>
                <li type="none">About</li>
                <li type="none">Contact us</li>
            </ul>
        </nav>
    </header>
    <div>
        <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Et cumque, laboriosam quas dolor possimus a aliquid in magnam. Perferendis reprehenderit ex illum aut! Dolor quibusdam tempora a dolores at, excepturi sed quae dolorem perspiciatis.
        </p>
    </div>
</body>
</html>
