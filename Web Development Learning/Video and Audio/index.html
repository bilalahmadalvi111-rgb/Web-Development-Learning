<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video and audio</title>
</head>
<body>
    <div>
        <video src="video.mp4" width="500" height="200"  ></video>
           1st without control option
    </div>
    <div>
        <video src="video.mp4" width="500" height="200" controls ></video>
             with control option
    </div>
    <div> 
        <video src="video.mp4" width="500" height="200" controls poster="download.jpg">
        </video>
        Adding poster like yt thumbnail
    </div>

    <div><audio src="farq.mp3" controls  ></audio></div>

    <iframe src="youtube video embed" frameborder="0"></iframe>
</body>
</html>
