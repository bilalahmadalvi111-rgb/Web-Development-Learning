<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model-Margin,Padding&Border</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box {
            background-color: rgb(99, 187, 238);
        }
        .box1{
            color: yellow;
            padding: 10px;
            margin: 25px;
            border: 2px solid blue;
            height: 200px;
            box-sizing: border-box;
            text-align: center;

        }
        .box2{
            color:red;
            padding: 10px  ;
            margin: 25px;
            border: 2px solid black;
            height: 200px;
            box-sizing: border-box;
            text-align: center;

        }
    </style>
</head>

<body>
    <div class="box box1"> I am a box 1</div>
    <div class="box box2"> I am a box 2</div>
</body>

</html>
