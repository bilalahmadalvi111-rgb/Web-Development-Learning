<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling List with CSS</title>
    <style>
        nav ul li
        {
            border: 2px solid black; 
            background-color: yellow;
            margin: 2px;
            list-style: devanagri;
            list-style-type: disc;
            list-style-position: inside;
            list-style-image: url(image "url");  
        
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact us</li>
        </ul>
    </nav>
</body>
</html>
