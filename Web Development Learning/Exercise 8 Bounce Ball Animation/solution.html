<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container
        {
            position: relative;
            background-color: blue;
            width: 80vw;
            height: 80vh;
        }
        .box
        {
            background-color: red;
            width: 50px;
            height: 50px;
            position: absolute;
            bottom: 0;
            left: 0;
            border-radius: 60px;
            animation: animatex 2s linear infinite ,
             animatey 1s ease-in-out infinite alternate;
        }
        @keyframes animatex {
            from{
                left: 0%;
            }
            to{
                left:95% ;

            }
            
        }

        @keyframes animatey {
            from{
                bottom: 0%;
            }
            to{
                bottom: 80%;   
            }
            
        }


    </style>
</head>
<body>
    <div class="container">
        <div class="box">
        

        </div>
    </div>
</body>
</html>
