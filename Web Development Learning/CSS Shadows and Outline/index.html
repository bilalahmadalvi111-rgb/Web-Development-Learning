<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows and Outline</title>
    <style>
        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 3px 7px 10px rgb(0, 255, 106);
        }
        .text-element{
            text-shadow: 2px 2px 4px black;
            outline: 2px solid black;
            outline-offset: 2px solid rgb(17, 17, 170);
        }
    </style>
</head>
<body>
    <p>
        Box Shadows Syntax:
        <br>
        box-shadow:horizontal verticle blur spread color inset
    </p>
    <div class="box">
        I am Box.
    </div>
    <p class="text-element">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugiat eaque reprehenderit rem ex temporibus? Excepturi qui aliquid tempore commodi accusantium quaerat fugit quae.
    </p>
</body>
</html>
